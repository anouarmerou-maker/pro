    <title>قرمزي برو | Krmzi Pro - عالم الدراما الآمن</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
      :root { --primary: #e50914; --background: #020202; }
      body { font-family: 'Cairo', sans-serif; background: var(--background); color: #e5e5e5; margin: 0; }
      ::-webkit-scrollbar { width: 0px; }
      #initial-loader { position: fixed; inset: 0; background: var(--background); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
      .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(229,9,20,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0?external=react,react-dom",
    "axios": "https://esm.sh/axios@1.7.9",
    "crypto-js": "https://esm.sh/crypto-js@4.2.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "express": "https://esm.sh/express@^5.2.1",
    "cors": "https://esm.sh/cors@^2.8.6",
    "url": "https://esm.sh/url@^0.11.4",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "cheerio": "https://esm.sh/cheerio@^1.2.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <div style="margin-top: 20px; font-weight: 900; color: white; letter-spacing: 2px; font-style: italic;">KRMZI PRO</div>
    </div>
    
    <div id="root"></div>

    <script type="module">
      import './index.tsx';
      
      window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
          }, 500);
        }
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
