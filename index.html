
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="monetag" content="56cd9aa4e994d6f0fb8bd1eeb2560d5d">
    
    <title>قرمزي برو | Krmzi Pro - عالم الدراما الآمن</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
      :root { --primary: #e50914; --background: #020202; }
      body { font-family: 'Cairo', sans-serif; background: var(--background); color: #e5e5e5; margin: 0; }
      ::-webkit-scrollbar { width: 0px; }
      #initial-loader { position: fixed; inset: 0; background: var(--background); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
      .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(229,9,20,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
  <body>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <div style="margin-top: 20px; font-weight: 900; color: white; letter-spacing: 2px; font-style: italic;">KRMZI PRO</div>
    </div>
    
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          setTimeout(function() {
            loader.style.opacity = '0';
            setTimeout(function() { loader.style.display = 'none'; }, 500);
          }, 500);
        }
      });
    </script>
</body>
</html>
